name: Release

on:
  release:
    types: [created]

jobs:
  build-and-publish:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack Journey (core)
        run: dotnet pack Journey/Journey.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.Postgres
        run: dotnet pack Journey.Postgres/Journey.Postgres.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.MySql
        run: dotnet pack Journey.MySql/Journey.MySql.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.Sqlite
        run: dotnet pack Journey.Sqlite/Journey.Sqlite.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.Mssql
        run: dotnet pack Journey.Mssql/Journey.Mssql.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.Cassandra
        run: dotnet pack Journey.Cassandra/Journey.Cassandra.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.All (meta-package)
        run: dotnet pack Journey.All/Journey.All.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.Net (all-in-one tool)
        run: dotnet pack Journey.Net/Journey.Net.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.Net.Postgres
        run: dotnet pack Journey.Net.Postgres/Journey.Net.Postgres.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.Net.MySql
        run: dotnet pack Journey.Net.MySql/Journey.Net.MySql.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.Net.Sqlite
        run: dotnet pack Journey.Net.Sqlite/Journey.Net.Sqlite.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.Net.Mssql
        run: dotnet pack Journey.Net.Mssql/Journey.Net.Mssql.csproj --no-build --configuration Release --output ./nupkgs

      - name: Pack Journey.Net.Cassandra
        run: dotnet pack Journey.Net.Cassandra/Journey.Net.Cassandra.csproj --no-build --configuration Release --output ./nupkgs
    
        # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push the packages
      - name: NuGet push
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  # Build the standalone CLI executables and attach them to the release, so that the
  # download link in the README keeps pointing at the version that was just published.
  standalone-assets:
    needs: build-and-publish  # do not attach binaries for a release whose tests failed
    permissions:
      contents: write  # needed to upload the archives to the release
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [win-x64, win-arm64, osx-x64, osx-arm64, linux-x64, linux-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the standalone executables
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # The archives are named for the release, so that they cannot drift from the tag.
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          for variant in \
            "journey:Journey.Command" \
            "journey-postgres:Journey.Command.Postgres" \
            "journey-mysql:Journey.Command.MySql" \
            "journey-sqlite:Journey.Command.Sqlite" \
            "journey-mssql:Journey.Command.Mssql" \
            "journey-cassandra:Journey.Command.Cassandra"
          do
            name="${variant%%:*}"
            project="${variant#*:}"
            echo "::group::$name ($PLATFORM)"
            dotnet publish "$project/$project.csproj" \
              --configuration Release \
              --runtime "$PLATFORM" \
              --framework net10.0 \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:Version="$version" \
              --output "publish/$name-$PLATFORM" \
              --nologo
            echo "::endgroup::"
          done

      - name: Archive the standalone executables
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cd publish
          for dir in *-"$PLATFORM"; do
            name="${dir%-$PLATFORM}"
            case "$PLATFORM" in
              win-*) zip -qr "${name}_${VERSION}_${PLATFORM}.zip" "$dir" ;;
              *)     tar -czf "${name}_${VERSION}_${PLATFORM}.tgz" "$dir" ;;
            esac
          done
          ls -lh ./*.zip ./*.tgz 2>/dev/null || true

      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # A platform produces either zips or tarballs, never both, so let the
          # pattern that matches nothing expand to nothing rather than to itself.
          shopt -s nullglob
          archives=(publish/*.zip publish/*.tgz)
          gh release upload "$TAG" "${archives[@]}" --clobber
